# Правила для обходчиков на стороне nginx.
#
# Дополняет /robots.txt (генерится из src/app/robots.ts). Тот — просьба, и читают
# её ровно те обходчики, которые нам и нужны: поисковики. Не читают её ровно те,
# от кого нагрузка. Здесь — то же самое, но отказом, и до того, как запрос дойдёт
# до Node: сайт работает одним процессом (typikon-web.service), и каждая страница,
# отданная роботу, — это страница, не отданная читателю.
#
# Как применить (вручную, из репозитория ничего не выкатывается):
#   1. scp typikon-bots.conf admin@HOST:/etc/nginx/conf.d/typikon-bots.conf
#      — именно в conf.d: карты и зоны ниже должны лежать в http{}, а не в server{};
#   2. в server{} сайта вставить блок «В server{}» из конца файла;
#   3. nginx -t && systemctl reload nginx
#
# Проверить:
#   curl -sI -A 'Bytespider' https://typikon.su/ | head -1       → 403
#   curl -sI -A 'Googlebot/2.1' https://typikon.su/ | head -1    → 200
#   curl -sI https://typikon.su/ | head -1                       → 200

# ── Кто пришёл ───────────────────────────────────────────────────────────────
# Порядок важен: nginx берёт первое совпавшее регулярное выражение сверху вниз,
# поэтому именные списки идут до общего «bot|crawler|spider».
map $http_user_agent $bot_class {
    default "human";

    # Собирают корпус для обучения. Ровно они закрыты в robots.txt — здесь то же
    # самое, но уже не просьбой. За теми же данными есть /api/v2, где для этого
    # заводится ключ с понятной квотой.
    "~*(GPTBot|ClaudeBot|anthropic-ai|CCBot|Bytespider|Amazonbot|PetalBot|Diffbot|ImagesiftBot|Omgilibot|Timpibot|meta-externalagent|FacebookBot)" harvester;

    # SEO-разведка: обходит сайт целиком и читателя не приводит вовсе.
    "~*(AhrefsBot|SemrushBot|MJ12bot|DotBot|BLEXBot|DataForSeoBot|serpstatbot|ZoominfoBot|Barkrowler|SeekportBot)" harvester;

    # Поисковики, которые читателя приводят, и разворачиватели ссылок в мессенджерах.
    "~*(Googlebot|Google-InspectionTool|YandexBot|YandexRenderResourcesBot|bingbot|Mail\.RU_Bot|DuckDuckBot|Applebot|Twitterbot|TelegramBot|facebookexternalhit|WhatsApp)" search;

    # Всё остальное, что признаётся машиной: безымянные скрипты и библиотеки.
    "~*(bot|crawler|spider|scrapy|python-requests|python-urllib|Go-http-client|okhttp|libwww|Wget|curl|HttpClient|Java/)" other;

    # Совсем без User-Agent — почти всегда скрипт.
    "" other;
}

# Запрос с ключом считает уже само приложение (src/lib/api/v2/access.ts): там свои
# тарифы, минутное окно и суточная квота. Второй счётчик поверх них только мешал бы —
# и в первую очередь нашему же мобильному приложению, которое ходит через okhttp и
# по общему списку попало бы в «other».
map $http_authorization $api_key {
    default 1;
    ""      0;
}

# Ключ счётчика. Пустая строка — счётчик не применяется вовсе, это штатный приём.
map "$bot_class:$api_key" $bot_key {
    default   "";
    "other:0"  $binary_remote_addr;
}

# Поисковикам — своя зона, широкая. Она не про них, а про подделки: назваться
# гуглботом может кто угодно, проверять по обратному DNS дорого, а десять запросов
# в секунду настоящему обходу хватает с запасом.
map "$bot_class:$api_key" $search_key {
    default    "";
    "search:0"  $binary_remote_addr;
}

limit_req_zone $bot_key     zone=bots_other:10m  rate=1r/s;
limit_req_zone $search_key  zone=bots_search:10m rate=10r/s;
# Поиск идёт по 12 млн символов, у калькулятора адресное пространство бесконечно —
# эти два раздела ограничиваем всем подряд, включая браузеры.
limit_req_zone $binary_remote_addr zone=heavy:10m rate=1r/s;

limit_req_status 429;
limit_req_log_level warn;

# ─────────────────────────────────────────────────────────────────────────────
# В server{} сайта:
#
#     # Выкачивателям — отказ. `if` с одним только `return` в server{} безопасен,
#     # это единственное его документированное применение.
#     if ($bot_class = harvester) {
#         return 403 "Massive crawling is not welcome. Use https://typikon.su/api\n";
#     }
#
#     # Безымянным скриптам — секунда между запросами, всплеск до десяти.
#     limit_req zone=bots_other burst=10 nodelay;
#     limit_req zone=bots_search burst=30 nodelay;
#
#     location /search  { limit_req zone=heavy burst=5 nodelay; proxy_pass http://127.0.0.1:80; }
#     location /calculator/ { limit_req zone=heavy burst=5 nodelay; proxy_pass http://127.0.0.1:80; }
#
# proxy_pass в двух location — тот же, что в основном location / этого server{};
# подставь фактический (порт задан в typikon-web.service, сейчас 80). Заголовки
# проксирования тоже нужны те же: приложение читает X-Forwarded-For и по нему
# считает свои лимиты (src/lib/rateLimit.ts).
