# Правила для обходчиков, часть первая: карты и зоны. Кладётся в http{}.
#     scp typikon-bots.conf admin@HOST:/etc/nginx/conf.d/typikon-bots.conf
#
# Сама по себе эта половина не делает ничего — она только заготавливает
# переменные и счётчики. Работают они там, где на них сошлются, а это вторая
# половина: typikon-bots-server.conf, которая кладётся в snippets/ и включается
# одной строкой в server{} сайта. Без неё nginx перезапустится молча и без
# единой ошибки, и ничего не изменится.
#
# Зачем всё это, если есть /robots.txt (src/app/robots.ts): тот — просьба, и
# читают её ровно те обходчики, которые нам и нужны, — поисковики. Не читают её
# ровно те, от кого нагрузка. Здесь то же самое, но отказом, и до того, как
# запрос дойдёт до Node: сайт работает одним процессом (typikon-web.service), и
# каждая страница, отданная роботу, — страница, не отданная читателю.
#
# ПРАВКА КЛЮЧА ЗОНЫ ТРЕБУЕТ RESTART, А НЕ RELOAD. Ключ у уже существующей зоны
# разделяемой памяти nginx на перезагрузке менять не умеет и отвечает на это
#     [emerg] limit_req "…" uses the "$…" key while previously it used the "$…" key
# в error.log, после чего откатывается на прежний конфиг. `nginx -t` этого не
# ловит и не может: он разбирает конфиг с нуля в отдельном процессе, где никакого
# «previously» нет, — проверка живёт только в работающем мастере. `systemctl
# reload` при этом возвращает успех, потому что мастер не падает. Снаружи это
# выглядит как «применилось, но ничего не изменилось»; лечится `systemctl restart`.
#
# ХОСТ ОБЩИЙ, сайтов на нём несколько, поэтому:
#   * имена карт и зон начинаются с typikon_ — совпади имя зоны с чужой (а «heavy»
#     на чужом сайте вполне может найтись), nginx не запустится вовсе;
#   * limit_req_status и limit_req_log_level стоят во второй половине, в server{}:
#     в http{} они поменяли бы код отказа всем остальным сайтам хоста;
#   * зоны занимают по 10 МБ разделяемой памяти каждая независимо от того,
#     пользуется ими кто-нибудь или нет. Три зоны — 30 МБ, это вся цена файла для
#     соседей. Больше они друг о друге ничего не узнают: карта вычисляется только
#     там, где переменную читают.

# ── Кто пришёл ───────────────────────────────────────────────────────────────
# Порядок важен: nginx берёт первое совпавшее регулярное выражение сверху вниз,
# поэтому именные списки идут до общего «bot|crawler|spider».
map $http_user_agent $typikon_bot_class {
    default "human";

    # Собирают корпус для обучения. Ровно они закрыты в robots.txt — здесь то же
    # самое, но уже не просьбой. За теми же данными есть /api/v2, где для этого
    # заводится ключ с понятной квотой.
    "~*(GPTBot|ClaudeBot|anthropic-ai|CCBot|Bytespider|Amazonbot|PetalBot|Diffbot|ImagesiftBot|Omgilibot|Timpibot|meta-externalagent|FacebookBot)" harvester;

    # SEO-разведка: обходит сайт целиком и читателя не приводит вовсе.
    "~*(AhrefsBot|SemrushBot|MJ12bot|DotBot|BLEXBot|DataForSeoBot|serpstatbot|ZoominfoBot|Barkrowler|SeekportBot)" harvester;

    # Поисковики, которые читателя приводят, и разворачиватели ссылок в мессенджерах.
    "~*(Googlebot|Google-InspectionTool|YandexBot|YandexRenderResourcesBot|bingbot|Mail\.RU_Bot|DuckDuckBot|Applebot|Twitterbot|TelegramBot|facebookexternalhit|WhatsApp)" search;

    # Всё остальное, что признаётся машиной: безымянные скрипты и библиотеки.
    "~*(bot|crawler|spider|scrapy|python-requests|python-urllib|Go-http-client|okhttp|libwww|Wget|curl|HttpClient|Java/)" other;

    # Совсем без User-Agent — почти всегда скрипт.
    "" other;
}

# Запрос с ключом считает уже само приложение (src/lib/api/v2/access.ts): там свои
# тарифы, минутное окно и суточная квота. Второй счётчик поверх них только мешал бы —
# и в первую очередь нашему же мобильному приложению, которое ходит через okhttp и
# по общему списку попало бы в «other».
map $http_authorization $typikon_has_key {
    default 1;
    ""      0;
}

# Ключ счётчика. Пустая строка — счётчик не применяется вовсе, это штатный приём.
map "$typikon_bot_class:$typikon_has_key" $typikon_bot_key {
    default   "";
    "other:0"  $binary_remote_addr;
}

# Поисковикам — своя зона, широкая. Она не про них, а про подделки: назваться
# гуглботом может кто угодно, проверять по обратному DNS дорого, а десять запросов
# в секунду настоящему обходу хватает с запасом.
map "$typikon_bot_class:$typikon_has_key" $typikon_search_key {
    default    "";
    "search:0"  $binary_remote_addr;
}

# Поиск идёт по 12 млн символов, у калькулятора адресное пространство бесконечно —
# эти два раздела ограничиваем всем подряд, включая браузеры. Через карту, а не
# через location: иначе пришлось бы заводить два location со своим proxy_pass и
# держать их в согласии с основным.
map $uri $typikon_heavy_key {
    default          "";
    "~^/search"      $binary_remote_addr;
    "~^/calculator/" $binary_remote_addr;
}

limit_req_zone $typikon_bot_key    zone=typikon_bots_other:10m  rate=1r/s;
limit_req_zone $typikon_search_key zone=typikon_bots_search:10m rate=10r/s;
limit_req_zone $typikon_heavy_key  zone=typikon_heavy:10m       rate=1r/s;
