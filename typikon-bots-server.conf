# Правила для обходчиков, часть вторая: то, что применяет заготовленное в
# typikon-bots.conf. Без неё первая половина не делает ничего.
#
#     scp typikon-bots-server.conf admin@HOST:/etc/nginx/snippets/typikon-bots-server.conf
#
# и одна строка в server{} сайта (в том, что на www.typikon.su, — на голом домене
# живёт только редирект):
#
#     include snippets/typikon-bots-server.conf;
#
# Затем: nginx -t && systemctl reload nginx

# Код отказа и уровень записи в лог — здесь, а не в http{}: иначе они достались бы
# всем сайтам хоста, включая те, что о нас не знают.
limit_req_status 429;
limit_req_log_level warn;

# Выкачивателям — отказ. `if` с одним только `return` в server{} безопасен, это
# единственное его документированное применение.
if ($typikon_bot_class = harvester) {
    return 403 "Massive crawling is not welcome. Use https://www.typikon.su/api\n";
}

# Безымянным скриптам — секунда между запросами, всплеск до десяти.
limit_req zone=typikon_bots_other  burst=10 nodelay;
# Поисковикам — вдесятеро шире; ограничение не про них, а про подделки под них.
limit_req zone=typikon_bots_search burst=30 nodelay;
# Поиск и калькулятор — всем подряд, включая браузеры. Ключ зоны пустой везде,
# кроме этих двух разделов, так что на остальных страницах счётчик не работает.
limit_req zone=typikon_heavy       burst=5  nodelay;
