# СТАРАЯ машина, include из http{} (/etc/nginx/sites-enabled/typikon-legacy).
# Заменить существующие vhost typikon.su/www.typikon.su, не добавлять рядом.
# Пути сертификата взять из действующего конфига; DNS .su не меняется.
# Общие snippets установить по инструкции docs/legacy-gateway.md.
map $uri $typikon_legacy_route {
    default page;
    ~^/api/ api;
    ~^/embed/ embed;
    ~^/dump/ dump;
    ~^/app/ app;
    ~\.ics$ calendar;
    /rss.xml rss;
    /.well-known/assetlinks.json assetlinks;
    ~^/\.well-known/acme-challenge/ acme;
}

# Личные токены календарей и query не попадают в access log.
log_format typikon_legacy escape=json
    '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
    '"route":"$typikon_legacy_route","status":$status,"seconds":$request_time,'
    '"upstream":"$upstream_addr","upstream_status":"$upstream_status"}';

server {
    listen 80;
    listen [::]:80;
    server_name typikon.su www.typikon.su;

    access_log /var/log/nginx/typikon-legacy.access.log typikon_legacy;
    error_log /var/log/nginx/typikon-legacy.error.log warn;
    include /etc/nginx/snippets/typikon-legacy-locations.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name typikon.su www.typikon.su;

    # Сохранить действующий сертификат с обоими именами и его продление.
    ssl_certificate /etc/letsencrypt/live/typikon.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/typikon.su/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/typikon-legacy.access.log typikon_legacy;
    error_log /var/log/nginx/typikon-legacy.error.log warn;
    include /etc/nginx/snippets/typikon-legacy-locations.conf;
}
