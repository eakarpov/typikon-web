# Included in the canonical typikon.info HTTPS server{}.
# An explicit location limit replaces the inherited anonymous-bot 1r/s limit.
# Other paths and the server-level harvester rejection keep their existing policy.
location ^~ /api/v2/cs/ {
    limit_req zone=typikon_cs_dictionary burst=20 nodelay;
    limit_req_status 429;
    error_page 429 = @typikon_cs_dictionary_limited;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location @typikon_cs_dictionary_limited {
    default_type application/json;
    add_header Retry-After 1 always;
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control no-store always;
    return 429 '{"error":{"code":"rate_limited","message":"Слишком много запросов"}}';
}
# The publication is server data, not a public download or an offline package.
location ^~ /dump/cs-dictionary/ {
    return 404;
}
