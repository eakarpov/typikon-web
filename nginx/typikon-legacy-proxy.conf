# СТАРАЯ машина: только внутри proxy location{}.
# Без URI/завершающего слеша: сохраняются исходные путь и query, включая escape.
proxy_pass https://www.typikon.info;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host www.typikon.info;
proxy_set_header X-Forwarded-Host www.typikon.info;
proxy_set_header X-Forwarded-Proto $scheme;

# Перезаписываем пользовательские заголовки. Новый nginx доверяет только IP шлюза.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_pass_request_headers on;
proxy_pass_request_body on;

proxy_ssl_server_name on;
proxy_ssl_name www.typikon.info;
proxy_ssl_verify on;
proxy_ssl_verify_depth 3;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

# Не повторять изменяющие запросы и не подменять ошибки API страницей nginx.
proxy_next_upstream off;
proxy_intercept_errors off;
proxy_redirect off;
proxy_cache off;
proxy_buffering off;
proxy_connect_timeout 10s;
proxy_read_timeout 120s;
proxy_send_timeout 120s;
client_max_body_size 20m;

# Один Sunset относится к отключению домена; прочие заголовки upstream сохраняются.
proxy_hide_header Sunset;
