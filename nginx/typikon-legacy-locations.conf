# СТАРАЯ машина: включается внутрь обоих server{}.
# Заголовки переезда добавляет шлюз, upstream видит канонический Host .info.
add_header Sunset "Fri, 15 Jan 2027 00:00:00 GMT" always;
add_header Link '<https://www.typikon.info>; rel="successor-version"' always;
add_header X-Typikon-Notice "moved to typikon.info; legacy host shuts down 2027-01-15" always;
add_header X-Typikon-Gateway "legacy-nginx" always;

# Оставить webroot, используемый действующим механизмом выпуска сертификата.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    try_files $uri =404;
}

# В том числе HTTP: не заставляем старые POST-клиенты следовать редиректу.
location ^~ /api/ {
    include /etc/nginx/snippets/typikon-legacy-proxy.conf;
}
location ^~ /embed/ {
    include /etc/nginx/snippets/typikon-legacy-proxy.conf;
}
location ^~ /dump/ {
    include /etc/nginx/snippets/typikon-legacy-proxy.conf;
}
location ^~ /app/ {
    include /etc/nginx/snippets/typikon-legacy-proxy.conf;
}
# Все подписные календари, включая приходские и личные, с query без изменений.
location ~ \.ics$ {
    include /etc/nginx/snippets/typikon-legacy-proxy.conf;
}
location = /rss.xml {
    include /etc/nginx/snippets/typikon-legacy-proxy.conf;
}
# Android требует прямой ответ, без редиректа между доменами или www.
location = /.well-known/assetlinks.json {
    include /etc/nginx/snippets/typikon-legacy-proxy.conf;
}

# Return находится в location, а не server: исключения выше должны работать.
location / {
    return 301 https://www.typikon.info$request_uri;
}
