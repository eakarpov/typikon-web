# СТАРАЯ машина: включается внутрь обоих server{}.
# Заголовки переезда добавляет шлюз, upstream видит канонический Host .info.
add_header Sunset "Fri, 15 Jan 2027 00:00:00 GMT" always;
add_header Link '<https://www.typikon.info>; rel="successor-version"' always;
add_header X-Typikon-Notice "moved to typikon.info; legacy host shuts down 2027-01-15" always;
add_header X-Typikon-Gateway "legacy-nginx" always;

# Оставить webroot, используемый действующим механизмом выпуска сертификата.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    try_files $uri =404;
}

# В том числе HTTP: не заставляем старые POST-клиенты следовать редиректу.
location ^~ /api/ {
    include /etc/nginx/snippets/typikon-legacy-proxy.conf;
}
location ^~ /embed/ {
    include /etc/nginx/snippets/typikon-legacy-proxy.conf;
}
location ^~ /dump/ {
    include /etc/nginx/snippets/typikon-legacy-proxy.conf;
}
location ^~ /app/ {
    include /etc/nginx/snippets/typikon-legacy-proxy.conf;
}
# Все подписные календари, включая приходские и личные, с query без изменений.
location ~ \.ics$ {
    include /etc/nginx/snippets/typikon-legacy-proxy.conf;
}
location = /rss.xml {
    include /etc/nginx/snippets/typikon-legacy-proxy.conf;
}
# Android требует прямой ответ, без редиректа между доменами или www.
location = /.well-known/assetlinks.json {
    include /etc/nginx/snippets/typikon-legacy-proxy.conf;
}

# Return находится в location, а не server: исключения выше должны работать.
location / {
    return 301 https://www.typikon.info$request_uri;
}

# BEGIN typikon civil calendar bridge
# Только основной сервер; фиксированный upstream, без передачи cookie и токенов.
location = /_internal/civil-calendar {
    allow 72.56.27.163;
    deny all;
    if ($request_method != GET) { return 405; }
    if ($arg_year !~ "^(19|20|21)[0-9]{2}$") { return 400; }
    if ($arg_cc !~ "^[a-z]{2}$") { return 400; }
    set $typikon_calendar_args "year=$arg_year&cc=$arg_cc&pre=1";
    set $args $typikon_calendar_args;
    rewrite ^ /api/getdata break;
    proxy_pass https://isdayoff.ru;
    proxy_set_header Host isdayoff.ru;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_ssl_server_name on;
    proxy_ssl_name isdayoff.ru;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 5s;
    proxy_read_timeout 8s;
    proxy_hide_header Set-Cookie;
    add_header Cache-Control "private, max-age=3600" always;
}
# END typikon civil calendar bridge
